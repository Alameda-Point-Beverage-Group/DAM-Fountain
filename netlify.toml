[build]
  command = "npm install && npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Ongoing AI tagging of newly-uploaded images. Scheduled only: Netlify refuses
# HTTP calls to it, and the function itself requires the scheduler's body or the
# AI_TAG_CRON_SECRET header (manual backfill).
[functions."ai-tag-cron"]
  schedule = "*/15 * * * *"

# Daily: is the ArtCraft key still accepted? → ops.sync_log → ops.fn_artcraft_health().
[functions."artcraft-probe-cron"]
  schedule = "17 14 * * *"

# AI Studio's ArtCraft calls wait for ArtCraft to accept a job (video downloads
# its references first) — give them the full synchronous window.
[functions."artcraft"]
  timeout = 26

# Clean URL for the read-only public API (token-gated). Must precede the SPA
# fallback so /api/assets reaches the function, not index.html.
[[redirects]]
  from = "/api/assets"
  to = "/.netlify/functions/dam-api"
  status = 200
  force = true

# Token-gated AI image generation for external tools (e.g. a Framer component).
[[redirects]]
  from = "/api/generate"
  to = "/.netlify/functions/image-generate"
  status = 200
  force = true

# Stable "live link" image delivery — /i/<assetId> always serves the current
# version. Partners embed it once; replacing the asset updates it everywhere.
[[redirects]]
  from = "/i/*"
  to = "/.netlify/functions/img-deliver/:splat"
  status = 200
  force = true

# SPA fallback — all non-asset, non-function routes serve index.html so the
# client router (incl. /s/:token public share pages) works on hard refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
